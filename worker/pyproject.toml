[project]
name = "worker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
    "assemblyai>=0.64.31",
    "openai>=2.45.0",
    "opencv-python-headless>=5.0.0.93",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "requests>=2.32.5",
    "open-clip-torch>=3.3.0",
    "imagehash>=4.3.2",
    "pillow>=12.3.0",
    "scenedetect-headless>=0.7,<0.8",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
    "debugpy>=1.8",
    "jupyterlab>=4.3,<5",
    "ipywidgets>=8.1,<9",
    "matplotlib>=3.10,<4",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: isolated tests that do not require external services",
    "integration: tests that exercise Postgres, queues, Storage, or other service boundaries",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
    { index = "pypi-default", marker = "sys_platform != 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
    { index = "pypi-default", marker = "sys_platform != 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pypi-default"
url = "https://pypi.org/simple"
explicit = true
