name: Discord notifications

on:
  push:
  pull_request_target:
    types: [opened]

permissions:
  contents: read

jobs:
  push:
    name: Notify about push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Send push notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DISCORD_WEBHOOK_URL:?Set the DISCORD_WEBHOOK_URL repository secret}"

          # Summarize the entire push so multiple commits produce one Discord notification.
          payload="$(jq -n \
            --arg actor "$(jq -r '.pusher.name' "$GITHUB_EVENT_PATH")" \
            --arg compare_url "$(jq -r '.compare' "$GITHUB_EVENT_PATH")" \
            --arg commit_url "$(jq -r '.head_commit.url' "$GITHUB_EVENT_PATH")" \
            --arg message "$(jq -r '.head_commit.message[0:750]' "$GITHUB_EVENT_PATH")" \
            --arg sha "$(jq -r '.after[0:7]' "$GITHUB_EVENT_PATH")" \
            --arg branch "${GITHUB_REF_NAME}" \
            --arg commit_count "$(jq -r '.commits | length | tostring' "$GITHUB_EVENT_PATH")" \
            --arg forced "$(jq -r '.forced | tostring' "$GITHUB_EVENT_PATH")" \
            '{
              username: "AdReady AI GitHub",
              embeds: [{
                title: ($branch + " updated at " + $sha),
                url: $compare_url,
                description: ($commit_count + " commit(s) pushed by **" + $actor + "**"),
                color: (if $forced == "true" then 15158332 else 3066993 end),
                fields: [
                  {name: "Head commit", value: ("[" + $message + "](" + $commit_url + ")"), inline: false},
                  {name: "Force push", value: $forced, inline: true}
                ],
                footer: {text: ("AdReadyAI/adready-ai • " + $branch)}
              }]
            }')"

          curl --fail-with-body --retry 3 \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$DISCORD_WEBHOOK_URL"

  pull-request-opened:
    name: Notify about opened pull request
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Send pull request notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DISCORD_WEBHOOK_URL:?Set the DISCORD_WEBHOOK_URL repository secret}"

          # Read only GitHub's trusted event payload; no pull request code is checked out or executed.
          payload="$(jq -n \
            --arg author "$(jq -r '.pull_request.user.login' "$GITHUB_EVENT_PATH")" \
            --arg base "$(jq -r '.pull_request.base.ref' "$GITHUB_EVENT_PATH")" \
            --arg body "$(jq -r '(.pull_request.body // "No description provided.")[0:1000]' "$GITHUB_EVENT_PATH")" \
            --arg head "$(jq -r '.pull_request.head.label' "$GITHUB_EVENT_PATH")" \
            --arg number "$(jq -r '.pull_request.number | tostring' "$GITHUB_EVENT_PATH")" \
            --arg title "$(jq -r '.pull_request.title' "$GITHUB_EVENT_PATH")" \
            --arg url "$(jq -r '.pull_request.html_url' "$GITHUB_EVENT_PATH")" \
            '{
              username: "AdReady AI GitHub",
              embeds: [{
                title: ("PR #" + $number + ": " + $title),
                url: $url,
                description: $body,
                color: 3447003,
                fields: [
                  {name: "Author", value: $author, inline: true},
                  {name: "Branches", value: ($head + " → " + $base), inline: true}
                ],
                footer: {text: "AdReadyAI/adready-ai • pull request opened"}
              }]
            }')"

          curl --fail-with-body --retry 3 \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$DISCORD_WEBHOOK_URL"
